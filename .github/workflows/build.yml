# Place this at .github/workflows/build.yml in your GitHub repo (e.g. man15h/buzz-agent).
# Builds the buzz-agent image on a native arm64 runner (off the NAS) and pushes to GHCR.
# The Dockerfile clones block/buzz at BUZZ_REF at build time — no fork of block/buzz needed.
name: Build buzz-agent image

on:
  push:
    branches: [main]              # auto-build on push (builds the default ref)
  workflow_dispatch:
    inputs:
      buzz_ref:
        description: "block/buzz ref to build buzz-acp from (a release tag)"
        required: true
        default: "v0.4.24"

concurrency:
  group: build-buzz-agent
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm        # free native arm64 runner (public repos) — no QEMU
    permissions:
      contents: read
      packages: write                # push to GHCR
    steps:
      - uses: actions/checkout@v4    # this repo: Dockerfile + entrypoint.sh
      - id: ref
        # workflow_dispatch supplies buzz_ref; push builds the default.
        run: echo "buzz_ref=${{ github.event.inputs.buzz_ref || 'v0.4.24' }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            BUZZ_REF=${{ steps.ref.outputs.buzz_ref }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/buzz-agent:${{ steps.ref.outputs.buzz_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Output digest
        run: |
          echo "Pushed ghcr.io/${{ github.repository_owner }}/buzz-agent:${{ steps.ref.outputs.buzz_ref }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"
          echo "Pin the homelab compose to:"
          echo "  ghcr.io/${{ github.repository_owner }}/buzz-agent:${{ steps.ref.outputs.buzz_ref }}@${{ steps.build.outputs.digest }}"
